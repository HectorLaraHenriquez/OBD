name: Android APK
on:
  push:
    branches: [main, 'claude/**']
    paths: [index.html, 'android-src/**', package.json, capacitor.config.json, 'ci/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: |
          mkdir -p www && cp index.html www/
          sed -i "s/__BUILD__/v${{ github.run_number }} · ${GITHUB_SHA::7}/" www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Plugin SPP (Bluetooth clásico)
        run: cp android-src/*.java android/app/src/main/java/cl/hector/tablero/obd/
      - name: Permisos y servicio en primer plano
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perms='''    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              '''
          assert s.count('<application')==1 and '</application>' in s
          s=s.replace('<application',perms+'<application',1)
          s=s.replace('</application>','    <service android:name=".ObdService" android:exported="false" android:foregroundServiceType="connectedDevice"/>\n    </application>')
          open(p,'w',encoding='utf-8').write(s)
          print(s)
          PY
      - name: Versión y firma debug estable
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk tablero-obd.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tablero-obd-apk
          path: tablero-obd.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK más reciente
          body: APK de depuración de Tablero OBD. Se reemplaza en cada compilación.
          files: tablero-obd.apk
          prerelease: true
